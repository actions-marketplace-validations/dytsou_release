name: Release (GitHub + npm)
description: Create a GitHub Release and/or publish to npm from a semver tag.
branding:
  icon: check-circle
  color: blue

inputs:
  tag:
    description: Tag to release (e.g. v1.2.3). Defaults to github.ref_name on tag push. Ignored when from-package-json=true.
    required: false
    default: ""
  body:
    description: Extra GitHub release body. Placeholders __TAG__ and __MAJOR__ are expanded.
    required: false
    default: ""
  from-package-json:
    description: Read version from package.json, optionally create the tag, and build commit notes
    required: false
    default: "false"
  package-json-path:
    description: Path to package.json (from-package-json only)
    required: false
    default: package.json
  create-missing-tag:
    description: Create and push v{version} when missing (from-package-json only)
    required: false
    default: "true"
  commit-notes:
    description: Prepend commit-list notes since previous tag (from-package-json only)
    required: false
    default: "true"
  generate-release-notes:
    description: Let GitHub generate release notes
    required: false
    default: "true"
  github-release:
    description: Create a GitHub Release
    required: false
    default: "true"
  move-major-tag:
    description: Force-update major tag (v1) (skipped for prereleases; github-release only)
    required: false
    default: "true"
  npm-publish:
    description: Publish to the npm registry
    required: false
    default: "false"
  npm-token:
    description: npm auth token (required when npm-publish=true)
    required: false
    default: ""
  npm-access:
    description: npm publish --access
    required: false
    default: public
  npm-tag:
    description: npm dist-tag (empty = latest, or next for prereleases when left empty)
    required: false
    default: ""
  working-directory:
    description: Directory containing package.json for npm publish
    required: false
    default: "."
  node-version:
    description: Node.js version for npm publish
    required: false
    default: "24"
  token:
    description: GitHub token for release + major tag push
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: package.json version when from-package-json=true
    value: ${{ steps.meta.outputs.version }}
  tag:
    description: Resolved release tag
    value: ${{ steps.meta.outputs.tag }}
  major:
    description: Major tag (e.g. v1)
    value: ${{ steps.meta.outputs.major }}
  prerelease:
    description: Whether the tag is a prerelease
    value: ${{ steps.meta.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Resolve tag
      id: resolve
      if: inputs.from-package-json != 'true'
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_BODY: ${{ inputs.body }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: node "${{ github.action_path }}/lib/resolve-tag.mjs"

    - name: Sync tag from package.json
      id: sync
      if: inputs.from-package-json == 'true'
      shell: bash
      env:
        INPUT_PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
        INPUT_CREATE_MISSING_TAG: ${{ inputs.create-missing-tag }}
        INPUT_COMMIT_NOTES: ${{ inputs.commit-notes }}
        INPUT_BODY: ${{ inputs.body }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/lib/sync-from-package-json.mjs"

    - name: Normalize outputs
      id: meta
      shell: bash
      env:
        FROM_PKG: ${{ inputs.from-package-json }}
        RESOLVE_TAG: ${{ steps.resolve.outputs.tag }}
        RESOLVE_MAJOR: ${{ steps.resolve.outputs.major }}
        RESOLVE_PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        RESOLVE_BODY: ${{ steps.resolve.outputs.body }}
        SYNC_VERSION: ${{ steps.sync.outputs.version }}
        SYNC_TAG: ${{ steps.sync.outputs.tag }}
        SYNC_MAJOR: ${{ steps.sync.outputs.major }}
        SYNC_PRERELEASE: ${{ steps.sync.outputs.prerelease }}
        SYNC_BODY: ${{ steps.sync.outputs.body }}
      run: |
        set -euo pipefail
        if [[ "${FROM_PKG}" == "true" ]]; then
          echo "version=${SYNC_VERSION}" >>"$GITHUB_OUTPUT"
          echo "tag=${SYNC_TAG}" >>"$GITHUB_OUTPUT"
          echo "major=${SYNC_MAJOR}" >>"$GITHUB_OUTPUT"
          echo "prerelease=${SYNC_PRERELEASE}" >>"$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "${SYNC_BODY}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
        else
          echo "version=" >>"$GITHUB_OUTPUT"
          echo "tag=${RESOLVE_TAG}" >>"$GITHUB_OUTPUT"
          echo "major=${RESOLVE_MAJOR}" >>"$GITHUB_OUTPUT"
          echo "prerelease=${RESOLVE_PRERELEASE}" >>"$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "${RESOLVE_BODY}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
        fi

    - name: Require at least one publish target
      shell: bash
      env:
        GITHUB_RELEASE: ${{ inputs.github-release }}
        NPM_PUBLISH: ${{ inputs.npm-publish }}
      run: |
        set -euo pipefail
        if [[ "${GITHUB_RELEASE}" != "true" && "${NPM_PUBLISH}" != "true" ]]; then
          echo "::error::Enable github-release and/or npm-publish (or use dytsou/release/github / dytsou/release/npm)"
          exit 1
        fi

    - name: Create GitHub Release
      if: inputs.github-release == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        token: ${{ inputs.token }}
        tag_name: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.tag }}
        prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        draft: false
        generate_release_notes: ${{ inputs.generate-release-notes }}
        body: ${{ steps.meta.outputs.body }}

    - name: Move major version tag
      if: inputs.github-release == 'true' && inputs.move-major-tag == 'true' && steps.meta.outputs.prerelease != 'true'
      shell: bash
      env:
        INPUT_TAG: ${{ steps.meta.outputs.tag }}
        INPUT_MAJOR: ${{ steps.meta.outputs.major }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: bash "${{ github.action_path }}/lib/move-major-tag.sh"

    - name: Setup Node (npm publish)
      if: inputs.npm-publish == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org

    - name: Publish to npm
      if: inputs.npm-publish == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_ACCESS: ${{ inputs.npm-access }}
        NPM_TAG_INPUT: ${{ inputs.npm-tag }}
        PRERELEASE: ${{ steps.meta.outputs.prerelease }}
      run: |
        set -euo pipefail
        if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
          echo "::error::npm-token is required when npm-publish=true"
          exit 1
        fi
        TAG_ARGS=()
        if [[ -n "${NPM_TAG_INPUT}" ]]; then
          TAG_ARGS=(--tag "${NPM_TAG_INPUT}")
        elif [[ "${PRERELEASE}" == "true" ]]; then
          TAG_ARGS=(--tag next)
        fi
        npm publish --access "${NPM_ACCESS}" "${TAG_ARGS[@]}"
