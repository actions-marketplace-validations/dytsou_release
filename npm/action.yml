name: npm Publish
description: Publish package.json to the npm registry for a semver tag.
branding:
  icon: package
  color: red

inputs:
  tag:
    description: Semver tag (e.g. v1.2.3). Used to default prerelease npm dist-tag. Defaults to github.ref_name on tag push.
    required: false
    default: ""
  npm-token:
    description: npm auth token
    required: true
  npm-access:
    description: npm publish --access
    required: false
    default: public
  npm-tag:
    description: npm dist-tag (empty = latest, or next for prereleases when left empty)
    required: false
    default: ""
  working-directory:
    description: Directory containing package.json
    required: false
    default: "."
  node-version:
    description: Node.js version
    required: false
    default: "24"

outputs:
  tag:
    description: Resolved release tag
    value: ${{ steps.resolve.outputs.tag }}
  major:
    description: Major tag (e.g. v1)
    value: ${{ steps.resolve.outputs.major }}
  prerelease:
    description: Whether the tag is a prerelease
    value: ${{ steps.resolve.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Resolve tag
      id: resolve
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_BODY: ""
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: node "${{ github.action_path }}/../lib/resolve-tag.mjs"

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org

    - name: Publish to npm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_ACCESS: ${{ inputs.npm-access }}
        NPM_TAG_INPUT: ${{ inputs.npm-tag }}
        PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
      run: |
        set -euo pipefail
        if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
          echo "::error::npm-token is required"
          exit 1
        fi
        TAG_ARGS=()
        if [[ -n "${NPM_TAG_INPUT}" ]]; then
          TAG_ARGS=(--tag "${NPM_TAG_INPUT}")
        elif [[ "${PRERELEASE}" == "true" ]]; then
          TAG_ARGS=(--tag next)
        fi
        npm publish --access "${NPM_ACCESS}" "${TAG_ARGS[@]}"
