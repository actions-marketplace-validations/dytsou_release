name: Bump Patch Version
description: Bump package.json patch version and open a pull request.
branding:
  icon: arrow-up
  color: blue

inputs:
  package-json-path:
    description: Path to package.json relative to the workspace
    default: package.json
  base-branch:
    description: Base branch for the tag-ahead check and pull request
    default: main
  labels:
    description: Comma-separated pull request labels
    default: ci, maintenance
  token:
    description: Token for creating the pull request
    default: ${{ github.token }}

outputs:
  version:
    description: New package.json version after the patch bump
    value: ${{ steps.bump.outputs.version }}
  pull-request-url:
    description: URL of the created pull request (empty if none)
    value: ${{ steps.pr.outputs.pull-request-url }}

runs:
  using: composite
  steps:
    - name: Ensure base branch has commits after latest tag
      shell: bash
      env:
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
      run: bash "${{ github.action_path }}/../lib/ensure-commits-after-tag.sh"

    - name: Bump package.json patch version
      id: bump
      shell: bash
      env:
        INPUT_PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: node "${{ github.action_path }}/../lib/bump-package-json.mjs"

    - name: Create Pull Request
      id: pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        token: ${{ inputs.token }}
        base: ${{ inputs.base-branch }}
        commit-message: "chore: bump version to ${{ steps.bump.outputs.version }}"
        branch: "chore/bump-patch-version-${{ github.run_id }}"
        delete-branch: true
        title: "chore: bump version to ${{ steps.bump.outputs.version }}"
        labels: ${{ inputs.labels }}
        body: |
          This PR bumps the **patch** version in `${{ inputs.package-json-path }}`.

          Triggered from [bump-patch-version](https://github.com/${{ github.repository }}/actions/workflows/bump-patch-version.yml).
